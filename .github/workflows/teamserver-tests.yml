name: Teamserver tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teamserver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'
          cache-dependency-path: teamserver/go.sum
      - name: Build teamserver packages
        working-directory: teamserver
        run: go build ./...
      - name: Repeat isolated regression suite
        working-directory: teamserver
        run: go test ./... -timeout 120s -count=2

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (MinGW cross-compiler, YARA)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 yara

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp/requirements.txt
          pip install pytest pytest-timeout

      - name: Tidy client module
        run: cd client/cli && go mod tidy

      - name: Run CI pipeline
        run: bash scripts/ci-pipeline.sh

      - name: Capability registry validation
        run: python scripts/validate-c2-capabilities.py